name: Python tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m seabed_planner hardware
      - run: python -m seabed_planner plan examples/legacy-15.json --iterations 10 --backend cpu --output outputs/ci-plan.json
      - run: python -m seabed_planner validate outputs/ci-plan.json
